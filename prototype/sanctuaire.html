<title>Sanctuaire Renaissant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Mise en page : une colonne mobile, barre de ressources collante en haut, onglets fixés en bas. Thème unique : nuit étoilée sur marbre. */
:root{
  --night:#16110f; --night-2:#211915; --night-3:#2d221c; --night-4:#3e2e24;
  --marble:#f2e7d3; --marble-dim:#b3a48d; --marble-faint:#77695a;
  --gold:#e1a94f; --gold-hi:#f6d48a; --bronze:#c47e48; --silver:#bfc8d8;
  --ok:#86c39a; --warn:#e4a852; --bad:#de7563;
  --feu:#e2804f; --eau:#62a6d8; --air:#c9d5e8; --terre:#b39561;
  --line:rgba(242,231,211,.11);
  --f-display:"Marcellus SC","Marcellus",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--marble);font:16px/1.45 var(--f-body);padding-block:0 calc(78px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--night) 80%,rgba(22,17,15,.92));border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 8px;display:grid;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.25rem;letter-spacing:.06em;color:var(--gold-hi)}
.brand .day{font-size:.85rem;color:var(--marble-dim)}
.brand .speed{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--night);background:var(--warn);border-radius:4px;padding:1px 6px}
.brand .sp{flex:1}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:1.1rem;color:var(--marble-dim)}
.resbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.res{min-width:0;background:var(--night-2);border-radius:8px;padding:5px 8px}
.res .k{display:flex;align-items:center;gap:5px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--marble-dim)}
.res .k i{width:7px;height:7px;border-radius:50%;display:inline-block}
.res .v{font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .r{font-size:.7rem;color:var(--marble-dim);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res.full .v{color:var(--warn)}

/* Onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--night-2);border-top:1px solid var(--line);padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));max-width:720px;margin:0 auto}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:grid;justify-items:center;gap:2px;color:var(--marble-dim);position:relative;font-size:.72rem;letter-spacing:.02em}
nav.tabs button .g{font-family:var(--f-display);font-size:1.15rem;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--gold-hi)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--gold)}
.badge{position:absolute;top:5px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:.65rem;font-weight:800;border-radius:9px;min-width:17px;padding:0 4px;line-height:17px}

/* Contenu */
main .wrap{padding-block:16px 24px;display:grid;gap:22px}
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.sec-h h2{font-size:1.1rem;letter-spacing:.05em;color:var(--marble)}
.sec-h .aside{font-size:.82rem;color:var(--marble-dim)}
.hint{font-size:.88rem;color:var(--marble-dim);margin:0}
.banner{border-left:3px solid var(--warn);background:rgba(228,168,82,.08);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.banner.info{border-color:var(--gold);background:rgba(217,171,79,.07)}
.banner.bad{border-color:var(--bad);background:rgba(222,117,99,.08)}

.hero{background:radial-gradient(120% 140% at 85% 0%,var(--night-4),var(--night-2) 60%);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.hero .lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--marble-dim)}
.hero .pow{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.hero .row{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--marble-dim)}
.hero .row b{color:var(--marble);font-weight:700}

.list{display:grid;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item.tap{cursor:pointer}
.item .main{min-width:0;display:grid;gap:3px}
.item .name{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item .sub{font-size:.84rem;color:var(--marble-dim)}
.item .meta{font-size:.8rem;color:var(--marble-dim);display:flex;flex-wrap:wrap;gap:4px 10px}
.item .right{display:grid;justify-items:end;gap:4px;text-align:right}
.lvl{font-family:var(--f-display);font-size:1.25rem;color:var(--marble);min-width:2.2ch;text-align:center}
.lvl small{display:block;font-family:var(--f-body);font-size:.62rem;letter-spacing:.1em;color:var(--marble-dim);text-transform:uppercase}

.pt{width:58px;height:58px;border-radius:10px;display:block;background:var(--night-3);object-fit:cover}
.pt.lg{width:132px;height:132px;border-radius:16px}
.pt.or{box-shadow:0 0 0 2px var(--gold)}
.pt.argent{box-shadow:0 0 0 2px var(--silver)}
.pt.bronze{box-shadow:0 0 0 2px var(--bronze)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;letter-spacing:.04em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--marble-dim);white-space:nowrap}
.chip.or{color:var(--gold-hi);border-color:rgba(217,171,79,.5)}
.chip.argent{color:var(--silver);border-color:rgba(191,200,216,.45)}
.chip.bronze{color:#e3a171;border-color:rgba(196,126,72,.5)}
.chip.role{color:var(--night);background:var(--marble-dim);border-color:transparent;font-weight:700}
.chip.role.pope{background:var(--gold)}
.chip.ok{color:var(--ok);border-color:rgba(134,195,154,.45)}
.chip.warn{color:var(--warn);border-color:rgba(228,168,82,.45)}
.chip.el-feu{color:var(--feu)}.chip.el-eau{color:var(--eau)}.chip.el-air{color:var(--air)}.chip.el-terre{color:var(--terre)}
.sign{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols",var(--f-body);}

.bar{height:5px;background:var(--night-3);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:3px;transition:width .6s linear}
.bar.blue>i{background:linear-gradient(90deg,#4f7fb8,var(--eau))}

.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;font-size:.9rem;background:var(--gold);color:#1a1408;white-space:nowrap}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--marble)}
.btn.danger{background:var(--bad);color:#1d0d09}
.btn:disabled{background:var(--night-3);color:var(--marble-faint);cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.cost{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;font-variant-numeric:tabular-nums}
.cost span{white-space:nowrap}
.cost .no{color:var(--bad)}
.cost i{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}

.bld{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:13px 0;border-bottom:1px solid var(--line)}
.bld .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bld .t b{font-size:1rem}
.bld .t .lv{font-family:var(--f-display);color:var(--gold-hi);font-size:.95rem}
.bld .eff{font-size:.84rem;color:var(--marble-dim)}
.bld .eff em{font-style:normal;color:var(--marble)}
.bld .act{grid-row:1 / span 3;grid-column:2;align-self:center;display:grid;justify-items:end;gap:4px}
.bld .time{font-size:.75rem;color:var(--marble-dim)}

.job{display:grid;gap:5px;padding:10px 12px;background:var(--night-2);border-radius:10px}
.job .h{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.job .h span:last-child{color:var(--marble-dim);font-variant-numeric:tabular-nums}

.recruit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px;border-radius:12px;background:var(--night-2);border:1px dashed rgba(217,171,79,.35)}
.recruit .btns{grid-column:1 / -1}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--night-2);border-radius:8px;padding:6px 8px}
.stat .k{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--marble-dim)}
.stat .v{font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}

.count{display:grid;gap:4px;padding:14px;border-radius:12px;background:var(--night-2)}
.count .k{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--marble-dim)}
.count .v{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.count.sea .v{color:var(--eau)}
.count.hell .v{color:#b593d6}
.count.ath .v{color:var(--gold-hi);font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.log{display:grid;gap:0;font-size:.88rem}
.log div{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.log span{color:var(--marble-dim);font-variant-numeric:tabular-nums;font-size:.8rem;padding-top:1px}

/* Fenêtre */
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(14,8,6,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--night-2);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head .main{min-width:0;flex:1;display:grid;gap:5px}
.sheet-head h2{font-size:1.35rem;color:var(--gold-hi)}
.close{position:sticky;top:0;justify-self:end;margin-bottom:-38px;background:var(--night-3);border:0;border-radius:50%;width:34px;height:34px;color:var(--marble);font-size:1.1rem;z-index:2}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 12px;border-radius:10px;background:var(--night-3);border:1px solid transparent;text-align:left;width:100%}
.opt.sel{border-color:var(--gold)}
.opt b{font-size:.95rem}
.opt .d{font-size:.8rem;color:var(--marble-dim);grid-column:1}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opts{display:grid;gap:7px}
textarea{width:100%;min-height:110px;background:var(--night);color:var(--marble);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace}
.result{padding:14px;border-radius:12px;text-align:center;display:grid;gap:6px}
.result.win{background:rgba(217,171,79,.12);border:1px solid rgba(217,171,79,.5)}
.result.lose{background:rgba(222,117,99,.1);border:1px solid rgba(222,117,99,.45)}
.result h3{font-size:1.3rem}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--marble-dim);font-size:.9rem;text-align:center}

.hero-top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.map-wrap{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) ;border-block:1px solid var(--line);background:#0b0f1d}
@media (min-width:600px){.map-wrap{margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}}
#map{display:block;width:100%;aspect-ratio:360/400;max-width:100%;cursor:pointer;touch-action:manipulation}
.sites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.site-btn{background:var(--night-2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:left;display:grid;gap:1px;min-width:0}
.site-btn b{font-size:.86rem}
.site-btn span{font-size:.72rem;color:var(--marble-dim);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--night-2);border-radius:10px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:8px;padding:8px 4px;font-weight:700;font-size:.88rem;color:var(--marble-dim)}
.seg button span{font-weight:400;font-size:.75rem;font-variant-numeric:tabular-nums}
.seg button[aria-selected="true"]{background:var(--night-4);color:var(--gold-hi)}
.bio{display:grid;gap:8px;padding:12px 14px;background:var(--night);border-radius:12px;border:1px solid var(--line)}
.bio-h{display:flex;flex-wrap:wrap;gap:6px}
.bio p{margin:0;font-size:.92rem;line-height:1.5}
.bio p.hint{font-size:.82rem}
.bio-p{grid-column:1 / -1;margin:0;font-size:.85rem;color:var(--marble-dim);line-height:1.45}
.chip.trait{color:var(--marble);border-color:rgba(236,230,216,.28)}
.wdot{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 38%,var(--sk) 0 9px,transparent 9.5px),radial-gradient(circle at 50% 30%,var(--hr) 0 10px,transparent 10.5px),linear-gradient(transparent 62%,#8a6a4a 62%);background-color:var(--night-3);display:block;margin-inline:9px}

.chip.q{color:#bfe0c6;border-color:rgba(134,195,154,.45)}
.chip.f{color:#f0b2a6;border-color:rgba(222,117,99,.45)}
.chip.sp{color:var(--night);background:var(--gold-hi);border-color:transparent;font-weight:800}
.nrg{display:grid;grid-template-columns:auto minmax(0,1fr) 2.6em;gap:8px;align-items:center;font-size:.78rem;color:var(--marble-dim)}
.nrg b{color:var(--marble);font-variant-numeric:tabular-nums;text-align:right}
.bar.green>i{background:linear-gradient(90deg,#4f8f63,var(--ok))}
.stat{position:relative}
.plus{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--gold);color:#1a1408;font-weight:800;font-size:1rem;line-height:1}
.sp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:.88rem;color:var(--gold-hi)}
.dt{border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--night)}
.dt summary{cursor:pointer;padding:11px 0;font-family:var(--f-display);font-size:1rem;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px}
.dt summary .aside{font-family:var(--f-body);font-size:.8rem;color:var(--ok)}
.dt[open]{padding-bottom:12px}
.dt .opts,.dt .list{margin-top:8px}
.tlist{display:grid;gap:6px;font-size:.86rem;color:var(--marble-dim);padding-bottom:4px}
.tlist b{margin-right:6px}.tlist b.q{color:#bfe0c6}.tlist b.f{color:#f0b2a6}
.hearts{display:flex;gap:3px}
.hearts i{width:9px;height:9px;border-radius:2px;background:var(--night-3);transform:rotate(45deg)}
.hearts i.on{background:#e48a9c}
.item.fr .pt{width:40px;height:40px;border-radius:8px}
.fp-box{font-size:.88rem;color:var(--marble-dim);background:rgba(228,138,156,.08);border-left:3px solid #e48a9c;border-radius:0 8px 8px 0;padding:9px 12px}
.fp-box b{color:#f2b3c0;font-size:1.05rem}
.flash{background:rgba(217,171,79,.12);border:1px solid rgba(217,171,79,.45);color:var(--gold-hi);border-radius:10px;padding:10px 12px;font-size:.92rem}
.mh{color:var(--gold-hi);font-size:1.35rem}
.elems{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.el{background:rgba(20,12,10,.45);border-radius:8px;padding:5px 6px;display:grid;min-width:0}
.el small{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--marble-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el b{font-variant-numeric:tabular-nums;font-size:.95rem}
.el.el-feu b{color:var(--feu)}.el.el-eau b{color:var(--eau)}.el.el-air b{color:var(--air)}.el.el-terre b{color:var(--terre)}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.inv-i{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;background:var(--night-2);border-radius:8px;padding:5px 9px;color:var(--marble-dim)}
.inv-i i{width:7px;height:7px;border-radius:50%}
.inv-i b{color:var(--marble);font-variant-numeric:tabular-nums}
.opt .d+.d{grid-column:1 / -1}

.chip.garde{color:#d9c4a2;border-color:rgba(154,125,90,.6)}
.pt.garde{box-shadow:0 0 0 2px #9a7d5a}
.elems.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.posts .opt{padding:8px 10px}
.posts .opt b{font-size:.86rem}
.pope-hero .pow{font-size:2rem}
.bonusrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bn{background:rgba(20,12,10,.45);border-radius:8px;padding:6px 8px;display:grid;justify-items:start;gap:1px;min-width:0}
.bn b{font-size:1.2rem;font-variant-numeric:tabular-nums;display:inline}
.bn small{font-size:.66rem;color:var(--marble-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gem{display:inline-block;width:10px;height:10px;transform:rotate(45deg);border-radius:2px;vertical-align:0;margin:0 4px 0 1px;flex:none}
.g-feu{background:var(--feu)}.g-eau{background:var(--eau)}.g-air{background:var(--air)}.g-terre{background:var(--terre)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--night-2);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;gap:7px;align-content:start;min-width:0}
.card.el-feu{border-top-color:var(--feu)}.card.el-eau{border-top-color:var(--eau)}.card.el-air{border-top-color:var(--air)}.card.el-terre{border-top-color:var(--terre)}
.card.art{border-top-color:var(--gold);background:linear-gradient(180deg,rgba(217,171,79,.07),var(--night-2) 60%)}
.card.art.own{opacity:.8}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ch b{font-size:.98rem;flex:1;min-width:0}
.ctier{font-family:var(--f-display);color:var(--marble-dim);font-size:.85rem}
.fav{color:var(--gold-hi);font-weight:800;font-size:.85rem;white-space:nowrap}
.cgem{font-size:.8rem;color:var(--marble-dim);display:flex;align-items:center}
.ceff{font-size:.84rem;color:var(--ok)}
.ccost{display:flex;flex-wrap:wrap;gap:6px}
.ccost .u{display:inline-flex;align-items:center;background:var(--night);border-radius:7px;padding:3px 8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.88rem}
.ccost .u s{color:var(--marble-faint);font-weight:400;margin-right:3px}
.ccost .u.met{outline:1px solid rgba(134,195,154,.6)}
.reqs{display:grid;gap:2px;font-size:.78rem}
.reqs .ok{color:var(--ok)}.reqs .no{color:var(--bad)}
.cbuy{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
nav.tabs button{font-size:.68rem}

.duel-head{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:radial-gradient(120% 160% at 50% 0%,var(--night-4),var(--night-2) 70%);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.duel-head .side{display:grid;gap:2px}
.duel-head .side small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--marble-dim)}
.duel-head .side b{font-family:var(--f-display);font-size:1.8rem;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.duel-head .side.god{text-align:right}.duel-head .side.god b{color:#e9a08f}
.duel-head .mid{display:grid;justify-items:center;font-size:.86rem}
.duel-head .mid small{color:var(--marble-dim);font-size:.72rem}
.pool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pool.cons{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pl{background:var(--night-2);border-radius:9px;padding:7px 9px;display:flex;align-items:baseline;gap:5px;min-width:0}
.pl b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.pl small{font-size:.7rem;color:var(--marble-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.empty{opacity:.45}
.star{color:var(--gold-hi);margin-right:3px}
.ccost .u.short{color:var(--bad);outline:1px solid rgba(222,117,99,.5)}
.card.cons{border-top-color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(217,171,79,.25)}
.duel-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--night) 35%);padding-block:14px 6px;z-index:3}
.duel-actions .btn:first-child{flex:1;padding-block:12px;font-size:1rem}
.fac{display:grid;gap:5px;padding:12px 0;border-bottom:1px solid var(--line)}
.fac .fh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.fac.me b{color:var(--gold-hi)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

}
function makePerson(seed,natPref){

 return{seed,sex,nat,name:pick(r,nat==='France'&&r()<.3?OCC[sex]:ZONES[NATS[nat].z][sex]),sign:Math.floor(r()*12),qual:t.qual,flaw:t.flaw,sp:0};

 const fixNat=p=>{if(OLD_NAT[p.nat])p.nat=OLD_NAT[p.nat];if(!NATS[p.nat])p.nat='Grèce';};

 };

 S.aps.forEach(a=>{enrich(a,false);if(a.job===undefined)a.job=null;a.wacc=a.wacc||0;});

 S.workers.forEach(fixNat);
 if(S.forgeJob&&S.forgeJob.work==null){const c=CONS_BY[S.forgeJob.cons];const w=ARMOR_WORK[c.rank];const done=S.forgeJob.end&&S.forgeJob.start?clamp((S.gt-S.forgeJob.start)/(S.forgeJob.end-S.forgeJob.start),0,1):0;S.forgeJob={cons:c.k,work:w,prog:w*done};}
 S.v=VERSION;

function step(h,sum){
 const R=rates();
 RKEYS.forEach(r=>{const v=S.res[r]+R[r]*h;S.res[r]=clamp(v,0,Math.max(cap(r),S.res[r]));});

  if(ap.job){ap.wacc=(ap.wacc||0)+h;while(ap.wacc>=24){ap.wacc-=24;ap.st[WORK[ap.job].stat]++;}}});
 S.knights.forEach(k=>{k.xp+=knightRate(k)*h;let g=0;while(k.xp>=need(k.lv)*1.5&&g++<50)levelUpKnight(k);});
 (S.guards||[]).forEach(gd=>{gd.xp+=guardRate(gd)*h;let g=0;while(gd.xp>=need(gd.lv)*1.5&&g++<50){gd.xp-=need(gd.lv)*1.5;gd.lv++;gd.sp=(gd.sp||0)+2;bonusStats(gd);S._dirty=true;}});
 people().forEach(p=>{p.nrg=Math.min(emax(p),(p.nrg||0)+eregen(p)*h);});
 S.workers.forEach(w=>{if(!w.job)return;if(w.job==='forge'&&!S.forgeJob)return;if((w.job==='herbo'||w.job==='atelier')&&!S.craft[w.job].length)return;
  w.sxp+=h;while(w.skill<10&&w.sxp>=24*w.skill){w.sxp-=24*w.skill;w.skill++;if(w.skill===5&&w.job==='forge'){const m=w.name+' est désormais maître forgeron. Les armures d’or ne lui résistent plus.';log(m);sum&&sum.ev.push(m);}S._dirty=true;}});
 if(S.forgeJob)S.forgeJob.prog+=forgeRate()*h;
 ['herbo','atelier'].forEach(ws=>{const q=S.craft[ws];if(!q.length)return;let left=craftRate(ws)*h;while(left>0&&q.length){const j=q[0];const r=REC_BY[j.k];const need=r.work-j.prog;if(left>=need){left-=need;q.shift();S.items[j.k]=(S.items[j.k]||0)+1;S._dirty=true;if(sum)sum.made[j.k]=(sum.made[j.k]||0)+1;}else{j.prog+=left;left=0;}}});
 S.fpAcc=(S.fpAcc||0)+h;const fpT=6/(1+cb('FP')/100);while(S.fpAcc>=fpT){S.fpAcc-=fpT;if(S.fp<30){S.fp++;S._dirty=true;}}
 S.gt+=h;
 for(let i=S.jobs.length-1;i>=0;i--){const j=S.jobs[i];if(S.gt>=j.end){let m;if(j.b[0]==='h'){const hi=+j.b.slice(1);S.houses[hi]=j.lvl;m='La maison '+de(SIGNS[hi].n)+' est restaurée au niveau '+j.lvl+'.';}else{S.b[j.b]=j.lvl;m=BUILD[j.b].n+' atteint le niveau '+j.lvl+'.';}S.jobs.splice(i,1);log(m);sum&&sum.ev.push(m);S._dirty=true;}}
 if(S.forgeJob&&S.forgeJob.prog>=S.forgeJob.work){const c=CONS_BY[S.forgeJob.cons];S.armors[c.k]='restauree';S.forgeJob=null;const m=armorName(c)+' est restaurée et attend un porteur.';log(m);sum&&sum.ev.push(m);S._dirty=true;}
 const iv=recruitInterval();
 if(iv<Infinity){S.recruitAcc+=h;if(S.recruitAcc>=iv){S.recruitAcc-=iv;if(S.pending.length<3){const a=makeApprentice();S.pending.push(a);const m='Un recruteur ramène '+a.name+', '+a.age+' ans, venu'+G(a,'e')+' '+NATS[a.nat].d+'.';log(m);sum&&sum.ev.push(m);S._dirty=true;}else S.recruitAcc=Math.min(S.recruitAcc,iv);}}
 [[POSEIDON_H-30*24,'p30','Les marées deviennent étranges sur toutes les côtes du monde. Poséidon s’agite dans son sommeil.'],[HADES_H-60*24,'h60','Les étoiles maléfiques brillent plus fort chaque nuit. Hadès prépare son retour.']].forEach(([t,f,m])=>{if(S.gt>=t&&!S.flags[f]){S.flags[f]=true;log(m);sum&&sum.ev.push(m);}});
}

function ptImg(p,rank,lg){return '<img class="pt'+(lg?' lg':'')+(rank?' '+rank:'')+'" src="'+portrait(p,rank)+'" alt="Portrait de '+esc(p.name)+'" width="'+(lg?132:58)+'" height="'+(lg?132:58)+'">';}
function signChip(i){const s=SIGNS[i];return '<span class="chip el-'+s.el+'"><span class="sign">'+s.s+'</span> '+s.n+'</span>';}
function rankChip(r){return '<span class="chip '+r+'">'+RANKS[r]+'</span>';}
function colorOf(k){return RES[k]?RES[k].c:ITEMS[k].c;}
function nameOf(k){return RES[k]?RES[k].n.toLowerCase():ITEMS[k].n.toLowerCase();}
function costHtml(c){return '<div class="cost">'+Object.keys(c).map(r=>'<span class="'+(have(r)<c[r]?'no':'')+'"><i style="background:'+colorOf(r)+'"></i>'+fmt(c[r])+' '+nameOf(r)+'</span>').join('')+'</div>';}
function traitChips(p){return (p.qual||[]).map(t=>'<span class="chip q">'+QUAL[t.k].n+' '+ROMAN[t.lv]+'</span>').join('')+(p.flaw||[]).map(t=>'<span class="chip f">'+FLAW[t.k].n+' '+ROMAN[t.lv]+'</span>').join('');}
function nrgBar(p){return '<div class="nrg"><span>Énergie</span><div class="bar green"><i data-nrg="'+p.id+'" style="width:'+clamp(p.nrg/emax(p)*100,0,100)+'%"></i></div><b data-nrgv="'+p.id+'">'+Math.floor(p.nrg)+'</b></div>';}

let CB={};
function cb(k){return CB[k]||0;}
function recomputeCB(){CB={};const add=e=>{if(!e)return;for(const k in e)CB[k]=(CB[k]||0)+e[k];};(S.perm||[]).forEach(c=>{add(c.eff);if(c.unlock)CB['U_'+c.unlock]=1;});(S.artefacts||[]).forEach(id=>add(ART_BY[id].eff));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initChamber(){S.cards=[];S.artefacts=[];S.decks={1:[],2:[],3:[]};S.market={1:[],2:[],3:[]};CARDS.forEach(c=>S.decks[c.t].push(c.id));[1,2,3].forEach(t=>{shuffle(S.decks[t]);refill(t);});}
function refill(t){while(S.market[t].length<3&&S.decks[t].length)S.market[t].push(S.decks[t].shift());}
function bonusOf(e){return(S.perm||[]).filter(c=>c.el===e).length;}
function faveur(){return S.faveur||0;}
function unitsDue(c){const o={};for(const e in c.cost)o[e]=Math.max(0,c.cost[e]-bonusOf(e));return o;}
function cardPrice(c){const u=unitsDue(c),p={};for(const e in u)if(u[e]>0){const U=UNIT[e];p[U.res]=(p[U.res]||0)+Math.round(u[e]*U.q*TIER_MULT[c.t]);}return p;}
function reqOk(r){
 switch(r.t){
 case'elem':return elemScores()[r.e]>=r.v;
 case'rank':return S.knights.some(k=>r.v==='argent'?(k.rank==='argent'||k.rank==='or'):k.rank===r.v);
 case'cosmos':return people().some(p=>p.st.co>=r.v);
 case'qual':return people().some(p=>ql(p,r.k)>=r.v);
 case'guards':return (S.guards||[]).length>=r.v;
 case'house':return S.houses.some(h=>h>=r.v);
 case'aps':return S.aps.length>=r.v;
 case'cons':return consScore()>=r.v;
 }return false;
}
function reqText(r){
 switch(r.t){
 case'elem':return 'Score '+ELEM[r.e].toLowerCase()+' ≥ '+r.v+' (actuel '+fmt(elemScores()[r.e])+')';
 case'rank':return r.v==='or'?'Un chevalier d’or':'Un chevalier d’argent ou d’or';
 case'cosmos':return 'Un personnage au cosmos ≥ '+r.v;
 case'qual':return 'Un personnage '+QUAL[r.k].n.toLowerCase()+(r.v>1?' de niveau '+ROMAN[r.v]:'');
 case'guards':return r.v+' garde'+(r.v>1?'s':'');
 case'house':return 'Une maison au niveau '+r.v;
 case'aps':return r.v+' apprentis';
 case'cons':return 'Score constellations ≥ '+r.v+' (actuel '+fmt(consScore())+')';
 }return '';
}
function reqsHtml(reqs){if(!reqs||!reqs.length)return '';return '<div class="reqs">'+reqs.map(r=>'<span class="'+(reqOk(r)?'ok':'no')+'">'+(reqOk(r)?'✓':'✗')+' '+esc(reqText(r))+'</span>').join('')+'</div>';}
function effsHtml(o){const parts=[];if(o.eff)for(const k in o.eff)parts.push(effText(k,o.eff[k]));if(o.unlock)parts.push(UNLOCK_N[o.unlock]);return parts.length?'<div class="ceff">'+parts.map(esc).join(' · ')+'</div>':'';}
function cardHtml(c,buyable){
 const due=unitsDue(c),price=cardPrice(c);const reqs=(c.req||[]).every(reqOk);const can=buyable&&reqs&&afford(price)&&!!pope();
 let h='<div class="card el-'+c.el+'"><div class="ch"><span class="ctier">'+ROMAN[c.t]+'</span><b>'+esc(c.n)+'</b>'+(c.fav?'<span class="fav">✦ '+c.fav+'</span>':'')+'</div>';
 h+='<div class="cgem">Donne +1 <span class="gem g-'+c.el+'"></span> '+ELEM[c.el]+' pour toujours</div>'+effsHtml(c);
 h+='<div class="ccost">'+Object.keys(c.cost).map(e=>'<span class="u"><span class="gem g-'+e+'"></span>'+(due[e]<c.cost[e]?'<s>'+c.cost[e]+'</s> ':'')+due[e]+'</span>').join('')+'</div>';
 h+=reqsHtml(c.req);
 if(buyable)h+='<div class="cbuy">'+(Object.keys(price).length?costHtml(price):'<div class="cost"><span>Gratuite grâce à vos cartes</span></div>')+'<button class="btn sm" data-act="buy:'+c.id+'"'+(can?'':' disabled')+'>Acquérir</button></div>';
 return h+'</div>';
}
function artReady(a){for(const e in a.need)if(bonusOf(e)<a.need[e])return false;return (a.req||[]).every(reqOk);}

const GOD_KEYS=Object.keys(GODS);
const DUEL_WIN=15,DUEL_TURNS=12,AI_MAX=3;
const NAMES_EL={
 feu:['Braise sacrée','Forge céleste','Flamme d’Hestia','Brasier du Lion','Torche d’Éleusis','Étincelle d’or','Volcan de Lemnos','Fournaise','Comète ardente','Autel de feu','Soleil couchant','Lame rougeoyante'],

};
const EFFPOOL={feu:[['P_metal',1],['FORGE',1.5],['TRIAL',.4],['XP',.5]],eau:[['P_vivres',1],['NRG',1],['P_herbes',2],['FP',3]],air:[['P_savoir',1],['RECRUIT',2],['XP',.5],['CRAFT',1.5]],terre:[['P_marbre',1],['BUILD',.8],['CAP',1.5],['DEF',2]]};
const EFFBASE={1:3,2:5,3:9};
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function duelAvailable(){if(S.match)return false;if(S.speed!==1)return S.gt-(S.duel.lastGt??-999)>=24;return S.duel.lastDate!==todayStr();}
function myBase(){const E=elemScores(),o={};EKEYS.forEach(e=>o[e]=2+Math.round(E[e]/3));return o;}
function myCons(){const o={};S.knights.forEach(k=>{o[k.cons]=(o[k.cons]||0)+Math.max(1,Math.round(k.st.co/4));});return o;}
function godState(k){if(!S.gods[k])S.gods[k]={lv:0,wins:0,losses:0,bonus:{feu:0,eau:0,air:0,terre:0}};return S.gods[k];}
function godBase(k,mine){const g=godState(k),G0=GODS[k];let tot=0;EKEYS.forEach(e=>tot+=mine[e]);tot*=(.65+.1*g.lv);const w={};let ws=0;EKEYS.forEach(e=>{w[e]=G0.aff.includes(e)?2:1;ws+=w[e];});const o={};EKEYS.forEach(e=>o[e]=Math.max(1,Math.round(tot*w[e]/ws))+(g.bonus[e]||0));return o;}
function genDeck(P,rnd){
 const used={feu:0,eau:0,air:0,terre:0};let id=0;const deck={1:[],2:[],3:[]};
 const mk=(t)=>{const el=EKEYS[Math.floor(rnd()*4)];const names=NAMES_EL[el];const n=names[used[el]++%names.length]+(used[el]>names.length?' II':'');
  const nEl=t===1?2:t===2?(rnd()<.5?2:3):(rnd()<.5?3:4);const others=EKEYS.slice().sort(()=>rnd()-.5).slice(0,nEl);
  const total=Math.max(nEl,Math.round(P*(t===1?1+rnd()*.4:t===2?1.8+rnd()*.6:3+rnd()*.8)));const cost={};let left=total;
  others.forEach((e,i)=>{const v=i===others.length-1?left:Math.max(1,Math.round(total/nEl*(.6+rnd()*.8)));cost[e]=Math.max(1,Math.min(left-(others.length-1-i),v));left-=cost[e];});
  const give=Math.max(1,Math.round(P*(.08+.08*t)));const fav=t===1?(rnd()<.25?1:0):t===2?(rnd()<.6?1:2):(rnd()<.5?2:3);
  const ep=EFFPOOL[el][Math.floor(rnd()*4)];const eff={};eff[ep[0]]=Math.max(1,Math.round(ep[1]*EFFBASE[t]));
  return{id:'d'+(id++),t,n,el,cost,give,fav,eff};};
 for(let i=0;i<14;i++)deck[1].push(mk(1));for(let i=0;i<12;i++)deck[2].push(mk(2));for(let i=0;i<8;i++)deck[3].push(mk(3));
 // cartes de constellation (réservées au Sanctuaire)
 const cons=myCons();Object.keys(cons).forEach(k=>{if(rnd()<.6){const c=CONS_BY[k];const t=c.rank==='or'?3:2;const e2=c.el;const cap=cons[k];
  const card={id:'d'+(id++),t,n:'Étoile '+de(c.n),el:e2,cost:{},give:Math.max(1,Math.round(P*(.15+.08*t))),fav:t===3?3:2,eff:{},cons:k};card.cost[e2]=Math.max(1,Math.round(P*.6));card.cost['c:'+k]=Math.max(1,Math.round(cap*.8));
  const ep=EFFPOOL[e2][Math.floor(rnd()*4)];card.eff[ep[0]]=Math.max(1,Math.round(ep[1]*EFFBASE[t]*1.3));deck[t].push(card);}});
 if(!cb('U_ambroisie'))deck[2].push({id:'d'+(id++),t:2,n:'Secret de l’ambroisie',el:'air',cost:{eau:Math.round(P*1),air:Math.round(P*.6)},give:1,fav:1,eff:{},unlock:'ambroisie'});
 if(!cb('U_huile'))deck[2].push({id:'d'+(id++),t:2,n:'Rite de l’huile sacrée',el:'feu',cost:{feu:Math.round(P*.9),terre:Math.round(P*.7)},give:1,fav:1,eff:{},unlock:'huile'});
 [1,2,3].forEach(t=>deck[t].sort(()=>rnd()-.5));
 return deck;
}
function startDuel(){
 if(!duelAvailable())return;
 const godK=GOD_KEYS[Math.floor(Math.random()*GOD_KEYS.length)];
 const base=myBase();let P=0;EKEYS.forEach(e=>P+=base[e]);P=Math.max(3,P/4);
 const rnd=mulberry32((Math.random()*2**31)|0);const decks=genDeck(P,rnd);
 const m={god:godK,turn:1,P,decks,market:{1:[],2:[],3:[]},me:{base,cons:myCons(),bonus:{},boost:{},fav:0,cards:[],spent:{},boosts:0},ai:{base:godBase(godK,base),bonus:{},fav:0,cards:[]},log:[],over:false,result:null};
 S.match=m;[1,2,3].forEach(t=>mRefill(t));
 S.duel.lastDate=todayStr();S.duel.lastGt=S.gt;
 m.log.unshift('Le Pope lève les yeux vers les astres. '+GODS[godK].n+' accepte le défi.');
 log('Lecture des astres : duel contre '+GODS[godK].n+'.');
}
function mRefill(t){const m=S.match;while(m.market[t].length<3&&m.decks[t].length)m.market[t].push(m.decks[t].shift());}
function pool(side){const m=S.match,s=m[side],o={};EKEYS.forEach(e=>o[e]=(s.base[e]||0)+(s.bonus[e]||0)+(s.boost?s.boost[e]||0:0));if(side==='me')for(const k in s.cons)o['c:'+k]=s.cons[k];return o;}
function canPay(card,side){if(side==='ai'&&card.cons)return false;const p=pool(side),sp=S.match[side].spent||{};for(const k in card.cost){if((p[k]||0)-(sp[k]||0)<card.cost[k])return false;}return true;}
function takeCard(card,side){const m=S.match,s=m[side];s.spent=s.spent||{};for(const k in card.cost)s.spent[k]=(s.spent[k]||0)+card.cost[k];
 m.market[card.t]=m.market[card.t].filter(c=>c.id!==card.id);mRefill(card.t);s.cards.push(card);s.fav+=card.fav;s.pending=(s.pending||[]);s.pending.push(card);}
function settle(side){const s=S.match[side];(s.pending||[]).forEach(c=>{s.bonus[c.el]=(s.bonus[c.el]||0)+c.give;});s.pending=[];s.spent={};}
function cardValue(c,side){const aff=GODS[S.match.god].aff.includes(c.el)?.6:0;let cs=0;for(const k in c.cost)cs+=c.cost[k];return(c.fav*3+c.give*1.4+aff)/Math.max(1,cs*.25);}
function aiTurn(){
 const m=S.match;m.ai.spent={};const bought=[];
 for(let g=0;g<AI_MAX;g++){const cand=[1,2,3].flatMap(t=>m.market[t]).filter(c=>canPay(c,'ai'));if(!cand.length)break;cand.sort((a,b)=>cardValue(b)-cardValue(a));const c=cand[0];takeCard(c,'ai');bought.push(c.n+(c.fav?' (✦'+c.fav+')':''));}
 if(m.turn%3===0){const e=GODS[m.god].aff[Math.floor(Math.random()*2)];m.ai.boost=m.ai.boost||{};m.ai.boost[e]=(m.ai.boost[e]||0)+1;bought.push('invoque +1 '+ELEM[e].toLowerCase());}
 settle('ai');
 m.log.unshift('Tour '+m.turn+' · '+GODS[m.god].n+' : '+(bought.length?bought.join(', '):'passe son tour')+'.');
}
function endTurn(){
 const m=S.match;if(!m||m.over)return;
 const mine=(m.me.pending||[]).map(c=>c.n+(c.fav?' (✦'+c.fav+')':''));
 m.log.unshift('Tour '+m.turn+' · Sanctuaire : '+(mine.length?mine.join(', '):'aucune carte')+'.');
 settle('me');aiTurn();
 if(m.me.fav>=DUEL_WIN||m.ai.fav>=DUEL_WIN||m.turn>=DUEL_TURNS){finishDuel();return;}
 m.turn++;
}
function totalBonus(s){let t=0;for(const e in s.bonus)t+=s.bonus[e];return t;}
function finishDuel(forfeit){
 const m=S.match;m.over=true;const g=godState(m.god);
 let res;if(forfeit)res='lose';else if(m.me.fav!==m.ai.fav)res=m.me.fav>m.ai.fav?'win':'lose';else{const a=totalBonus(m.me),b=totalBonus(m.ai);res=a===b?'draw':a>b?'win':'lose';}
 m.result=res;
 if(res==='win'){g.losses++;S.faveur=(S.faveur||0)+m.me.fav;log('★ Le Pope l’emporte sur '+GODS[m.god].n+' ('+m.me.fav+' ✦ contre '+m.ai.fav+').');if(!m.me.cards.length){S.match=null;}}
 else if(res==='lose'){g.wins++;g.lv++;const bestEl=EKEYS.slice().sort((a,b)=>(m.ai.bonus[b]||0)-(m.ai.bonus[a]||0))[0];g.bonus[bestEl]=(g.bonus[bestEl]||0)+1;log(GODS[m.god].n+' l’emporte et en sort grandi'+(m.god==='eris'||m.god==='artemis'||m.god==='demeter'?'e':'')+' (niveau '+g.lv+').');}
 else log('Duel indécis contre '+GODS[m.god].n+'.');
}
function keepCard(id){const m=S.match;if(!m||m.result!=='win')return;const c=m.me.cards.find(x=>x.id===id);if(!c)return;
 S.perm.push({n:c.n,el:c.el,t:c.t,eff:c.eff,unlock:c.unlock||null,fav:c.fav,god:m.god});recomputeCB();log('Le Sanctuaire garde à jamais « '+c.n+' ».');S.match=null;}
function poolHtml(){
 const m=S.match,p=pool('me'),sp=m.me.spent||{};
 let h='<div class="pool">'+EKEYS.map(e=>{const left=p[e]-(sp[e]||0);return '<div class="pl'+(left<=0?' empty':'')+'"><span class="gem g-'+e+'"></span><b>'+left+'</b><small>/ '+p[e]+'</small></div>';}).join('')+'</div>';
 const ck=Object.keys(m.me.cons);if(ck.length)h+='<div class="pool cons">'+ck.map(k=>{const left=p['c:'+k]-(sp['c:'+k]||0);return '<div class="pl'+(left<=0?' empty':'')+'"><span class="star">✦</span><b>'+left+'</b><small>/ '+p['c:'+k]+' cosmos '+esc(CONS_BY[k].n)+'</small></div>';}).join('')+'</div>';

function trialEval(a,c){

 if(c.rank==='or'&&c.sign!==a.sign)return{ok:false,why:'Réservée aux natifs '+de(SIGNS[c.sign].n)};
 if(c.rank==='or'&&!a.awk)return{ok:false,why:'Cosmos non éveillé'};
 if(a.pot<TRIAL_POT[c.rank])return{ok:false,why:'Son cosmos ne résonne pas avec cette armure'};
 const el=c.el===SIGNS[a.sign].el;
 const tr=-.04*ql(a,'fougueux')+.04*ql(a,'patient')+.03*ql(a,'orgueilleux')-.05*fl(a,'impulsif')-(c.rank!=='bronze'?.06*fl(a,'peureux'):0);
 const ch=clamp(.4+.04*(a.lv-TRIAL_LV[c.rank])+(el?.15:0)+a.st.co/300+tr+cb('TRIAL')/100,.1,.95);
 return{ok:true,ch,el};
}

 case'post':{const gd=(S.guards||[]).find(q=>q.id===+x);if(!gd)return;gd.post=y;flash=gd.name+' prend son poste : '+postName(y)+'.';break;}
 case'buy':{const c=CARD_BY[x];if(!c||!pope()||!S.market[c.t].includes(x))return;if(!(c.req||[]).every(reqOk))return;const pr=cardPrice(c);if(!afford(pr))return;pay(pr);S.market[c.t]=S.market[c.t].filter(i=>i!==x);S.cards.push(x);refill(c.t);recomputeCB();log('Le Pope acquiert la carte « '+c.n+' ».');break;}
 case'stars':{const t=+x;if(S.res.savoir<40||!S.decks[t].length)return;S.res.savoir-=40;S.decks[t]=S.decks[t].concat(S.market[t]);S.market[t]=[];refill(t);break;}
 case'claim':{const ar=ART_BY[x];if(!ar||(S.artefacts||[]).includes(x)||!artReady(ar))return;S.artefacts.push(x);recomputeCB();log('★ Le Sanctuaire reçoit un artefact : '+ar.n+'.');break;}
 case'ambroisie':{const p=getP(x,+y);if(!p||(S.items.ambroisie||0)<1)return;S.items.ambroisie--;p.nrg=emax(p);if(S.aps.includes(p)){p.xp+=xpRate(p)*12;let g=0;while(p.xp>=need(p.lv)&&g++<50)levelUpAp(p,null);}else if(S.knights.includes(p))p.xp+=knightRate(p)*12;else p.xp+=guardRate(p)*12;flash=p.name+' goûte l’ambroisie.';break;}
 case'huile':{if(!S.forgeJob||(S.items.huile||0)<1)return;S.items.huile--;S.forgeJob.prog=Math.min(S.forgeJob.work,S.forgeJob.prog+S.forgeJob.work*.5);break;}
 case'ap':openModal(apModal(+x));return;
 case'sp':{const p=getP(x,+y);if(!p||!(p.sp>0)||!STATN[z])return;p.sp--;p.st[z]++;break;}
 case'spauto':{const p=getP(x,+y);if(!p)return;while(p.sp>0){const ks=['fo','vi','en','co'];let m=ks[0];ks.forEach(s=>{if(p.st[s]<p.st[m])m=s;});p.st[m]++;p.sp--;}break;}
 case'potion':{const p=getP(x,+y);if(!p||(S.items.potion||0)<1)return;S.items.potion--;p.nrg=Math.min(emax(p),p.nrg+40);flash=p.name+' boit une potion d’endurance.';break;}
 case'onguent':{const ap=S.aps.find(q=>q.id===+x);if(!ap||(S.items.onguent||0)<1)return;S.items.onguent--;ap.cd=S.gt;flash='Les blessures de '+ap.name+' sont soignées. Nouvelle épreuve possible.';break;}
 case'cure':{const p=getP(x,+y);if(!p)return;const t=(p.flaw||[]).find(f=>f.k===z);if(!t)return;const F=FLAW[z];if(p.nrg<40||(S.items[F.cure]||0)<1)return;p.nrg-=40;S.items[F.cure]--;
  const ch=clamp(.45+.1*ql(p,'perseverant')-.1*(t.lv-1),.1,.9);
  if(Math.random()<ch){t.lv--;if(t.lv<=0){p.flaw=p.flaw.filter(f=>f!==t);flash=p.name+' n’est plus '+F.n.toLowerCase()+' !';log(flash);}else flash=p.name+' progresse : '+F.n.toLowerCase()+' '+ROMAN[t.lv]+'.';}
  else flash=p.name+' n’y arrive pas cette fois. L’énergie et l’objet sont perdus.';break;}
 case'boost':{const p=getP(x,+y);if(!p)return;const t=(p.qual||[]).find(q=>q.k===z);if(!t||t.lv>=3)return;const sav=30*t.lv;if(p.nrg<50||(S.items.elixir||0)<1||S.res.savoir<sav)return;p.nrg-=50;S.items.elixir--;S.res.savoir-=sav;
  if(Math.random()<clamp(.4+.05*ql(p,'perseverant'),.1,.9)){t.lv++;flash=p.name+' : '+QUAL[z].n.toLowerCase()+' '+ROMAN[t.lv]+' !';log(flash);}else flash='Pas de progrès cette fois pour '+p.name+'.';break;}
 case'friend':{const a1=byId(+x),b1=byId(+y);if(!a1||!b1||S.fp<1)return;const fk=fkey(a1.id,b1.id);if((S.friend[fk]||0)>=10)return;S.fp--;S.friend[fk]=(S.friend[fk]||0)+1;break;}
 case'duo':{const ap=S.aps.find(q=>q.id===+x),kn=S.knights.find(q=>q.id===+y);if(!ap||!kn||ap.nrg<DUO_E||kn.nrg<DUO_E)return;ap.nrg-=DUO_E;kn.nrg-=DUO_E;
  const rate=10*arena()*(1+kn.lv/40+({or:.5,argent:.25,bronze:0})[kn.rank])*affinity(ap,kn).x*(1+friendBonus(ap))*(1-.06*fl(ap,'paresseux'));
  ap.xp+=rate*8;let g=0;while(ap.xp>=need(ap.lv)&&g++<50)levelUpAp(ap,null);
  const fk=fkey(ap.id,kn.id);S.friend[fk]=Math.min(10,(S.friend[fk]||0)+1);
  flash=kn.name+' entraîne '+ap.name+' : +'+fmt(rate*8)+' XP, amitié '+S.friend[fk]+'/10.';
  const teach=kn.qual.filter(t=>!ql(ap,t.k));if(teach.length&&ap.qual.length<3&&Math.random()<.15){const t=teach[Math.floor(Math.random()*teach.length)];ap.qual.push({k:t.k,lv:1});flash+=' '+ap.name+' apprend à être '+QUAL[t.k].n.toLowerCase()+' !';log(kn.name+' transmet sa qualité ('+QUAL[t.k].n.toLowerCase()+') à '+ap.name+'.');}
  break;}
 case'assign':{const ap=S.aps.find(q=>q.id===+x);if(!ap)return;if(y==='none'){ap.master=null;break;}const kn=S.knights.find(q=>q.id===+y);if(!kn||kn.role!=='maitre')return;if(S.aps.filter(q=>q.master===kn.id).length>=3&&ap.master!==kn.id)return;ap.master=kn.id;break;}
 case'role':{const kn=S.knights.find(q=>q.id===+x);if(!kn)return;const nr=y==='none'?null:y;if(nr==='pope'&&pope()&&pope().id!==kn.id)return;
  if(kn.role==='maitre'&&nr!=='maitre')S.aps.forEach(ap=>{if(ap.master===kn.id)ap.master=null;});
  if(nr==='recruteur'&&kn.role!=='recruteur'&&!knightsWith('recruteur').length)S.recruitAcc=0;
  kn.role=nr;if(nr)log(kn.name+' devient '+ROLES[nr].n+'.');break;}
 case'accept':{const i=+x,ap=S.pending[i];if(!ap||S.aps.length>=capacity())return;S.pending.splice(i,1);S.aps.push(ap);log(ap.name+' rejoint le Sanctuaire comme apprenti'+G(ap,'e')+'.');break;}
 case'dismiss':{const ap=S.pending.splice(+x,1)[0];if(ap)log(ap.name+' est reconduit'+G(ap,'e')+' chez sa famille.');break;}
 case'sess':{const ap=S.aps.find(q=>q.id===+x),s=SESS.find(q=>q.k===y);if(!ap||!s)return;const c=s.cost(ap);if(!afford(c)||ap.nrg<SESS_E)return;pay(c);ap.nrg-=SESS_E;
  if(Math.random()<.1*fl(ap,'distrait')){flash=ap.name+' a la tête ailleurs : séance ratée.';break;}
  if(y==='xp'){ap.xp+=xpRate(ap)*6;let g=0;while(ap.xp>=need(ap.lv)&&g++<50)levelUpAp(ap,null);flash='Retraite terminée : +6 h de formation.';}else{ap.st[y]+=2;flash='+2 '+STATN[y]+' pour '+ap.name+'.';}break;}
 case'trialOpen':lastTrial=null;openModal(trialModal(+x));return;
 case'trial':{const ap=S.aps.find(q=>q.id===+x),c=CONS_BY[y];if(!ap||!c)return;const e=trialEval(ap,c);if(!e.ok)return;
  const win=Math.random()<e.ch;const cd=ql(ap,'orgueilleux')?24:12;
  if(win){S.aps.splice(S.aps.indexOf(ap),1);S.armors[c.k]='portee';
   const kn={id:ap.id,seed:ap.seed,sex:ap.sex,name:ap.name,nat:ap.nat,qual:ap.qual,flaw:ap.flaw,bio:ap.bio,sign:ap.sign,rank:c.rank,cons:c.k,lv:ap.lv,xp:0,st:Object.assign({},ap.st),role:null,tech:ap.tech.concat([SIG_WORDS[ap.seed%SIG_WORDS.length]+' '+(c.rank==='or'?'d’or':de(c.n))]),origin:'forme',pot:ap.pot,sp:ap.sp||0,nrg:ap.nrg};
   S.knights.push(kn);if(c.rank==='or'&&!S.houses[c.sign])S.houses[c.sign]=1;
   log('★ '+ap.name+' obtient l’'+armorLow(c)+' et devient chevalier de '+RANKS[c.rank].toLowerCase()+' !');}
  else{ap.xp*=Math.min(1,.33*ql(ap,'perseverant'));ap.cd=S.gt+cd;log(ap.name+' échoue à l’épreuve de l’'+armorLow(c)+'.');}
  lastTrial={id:ap.id,win,name:ap.name,rank:c.rank,cons:c.n,sex:ap.sex,cd};save();render();return;}
 case'restore':{const c=CONS_BY[x];const cost=ARMOR_COST[c.rank];if(S.forgeJob||S.b.forge<ARMOR_FORGE[c.rank]||bestSmith()<ARMOR_SMITH[c.rank]||!afford(cost)||S.armors[x]!=='brisee')return;pay(cost);S.forgeJob={cons:x,work:ARMOR_WORK[c.rank],prog:0};log('L’atelier commence la restauration de l’'+armorLow(c)+'.');break;}
 case'settings':resetArmed=false;ioMsg='';openModal(settingsModal);return;
 case'speed':S.speed=+x;break;
 case'exportSave':{save();const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$('#saveIo');ta.value=code;ta.select();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(()=>{ioMsg='Code copié dans le presse-papiers.';$('#sheetBody').innerHTML=settingsModal();$('#saveIo').value=code;},()=>{ioMsg='Copie automatique impossible : le code est sélectionné, copiez-le à la main.';});}else ioMsg='Le code est sélectionné, copiez-le à la main.';return;}
 case'importSave':{const v=$('#saveIo').value.trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||!(o.v>=1&&o.v<=VERSION))throw 0;S=migrate(o);recomputeCB();S.lastReal=Date.now();save();ioMsg='Partie chargée.';}catch(e){ioMsg='Ce code n’est pas reconnu. Vérifiez qu’il a été collé en entier.';}break;}
 case'resetArm':resetArmed=true;break;
 case'resetCancel':resetArmed=false;break;
 case'resetGo':try{localStorage.removeItem(KEY);}catch(e){}newGame();recomputeCB();save();closeModal();render();return;
 }
 save();render();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled){act(t.dataset.act);return;}if(e.target.id==='sheet'){lastTrial=null;closeModal();render();}});

/* ---------- boucle ---------- */
let saveTick=0;
function tick(){
 const n=Date.now();const dt=(n-S.lastReal)/36e5;S.lastReal=n;
 if(dt>.05){offline(dt);return;}
 advance(dt*S.speed,null);
 if(S._dirty&&!modalFn)render();else liveUpdate();
 if(++saveTick>=10){saveTick=0;save();}
}
function offline(dtReal){
 const before=Object.assign({},S.res);const sum=newSum();const dt=dtReal*S.speed;
 advance(dt,sum);save();render();
 if(dt>=.1)openModal(absenceModal(dt,before,sum));
}
function start(data){
 S=(data&&data.S)?migrate(data.S):load();
 const fresh=!S;if(fresh){newGame();save();}
 recomputeCB();
 S.tab=S.tab||'sanctuaire';
 render();
 if(!fresh){const dt=(Date.now()-S.lastReal)/36e5;S.lastReal=Date.now();if(dt>.01){const before=Object.assign({},S.res),sum=newSum();advance(dt*S.speed,sum);save();render();if(dt*S.speed>=.1)openModal(absenceModal(dt*S.speed,before,sum));}}
 setInterval(tick,1000);
 requestAnimationFrame(mapLoop);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
 window.addEventListener('pagehide',save);
 window.addEventListener('resize',()=>{staticSig='';});
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>{save();return{S};});}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
