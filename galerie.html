<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie des personnages (développement)</title>
<style>body{margin:0;background:#16110f;color:#f2e7d3;font:14px system-ui}h2{margin:12px}.g{display:flex;flex-wrap:wrap;gap:8px;padding:8px}.c{background:#211915;border-radius:10px;padding:6px;text-align:center;width:150px}.c img{display:block;width:150px;height:auto}.c small{display:block;opacity:.7}.b img{width:96px;border-radius:12px;margin:auto}</style>
</head><body>
<h2>Corps entiers</h2><div class="g" id="full"></div>
<h2>Portraits</h2><div class="g" id="bust"></div>
<script type="module">
import { specOf, svgFull, svgBust, dataUrl } from './src/art/character.js';
const C=[
 {sex:'F',nat:'Grèce',rank:'or',cons:'or-0',sign:0},{sex:'M',nat:'Nigeria',rank:'or',cons:'or-4',sign:4},{sex:'F',nat:'Japon',rank:'argent',cons:'lyre',sign:2},
 {sex:'M',nat:'Inde',rank:'argent',cons:'persee',sign:1},{sex:'F',nat:'Brésil',rank:'bronze',cons:'pegase',sign:6},{sex:'M',nat:'Irlande',rank:'bronze',cons:'dragon',sign:3},
 {sex:'F',nat:'Éthiopie',rank:'or',cons:'or-7',sign:7},{sex:'M',nat:'Japon',rank:'or',cons:'or-1',sign:1},
 {sex:'F',nat:'France',age:12},{sex:'M',nat:'Kenya',age:10},{sex:'M',nat:'Grèce',elder:true},
 {sex:'M',nat:'Russie',faction:'ares',boss:true},{sex:'F',nat:'Norvège',faction:'artemis'},{sex:'M',nat:'Mexique',faction:'bandits'},{sex:'F',nat:'Iran',faction:'dionysos'},{sex:'M',nat:'Chine',faction:'hermes'}
];
const full=document.getElementById('full'),bust=document.getElementById('bust');
C.forEach((c,i)=>{const p={seed:1000+i*7919,sign:c.sign??(i%12),...c};
 const s=specOf(p,{rank:c.rank??null,faction:c.faction,boss:c.boss,elder:c.elder,child:c.age!=null});
 const lab=(c.rank||c.faction||(c.age?'apprenti':'villageois'))+' · '+c.sex+' · '+c.nat;
 full.insertAdjacentHTML('beforeend','<div class="c"><img src="'+dataUrl(svgFull(s,{w:300,h:675}))+'"><small>'+lab+'</small></div>');
 bust.insertAdjacentHTML('beforeend','<div class="c b"><img src="'+dataUrl(svgBust(s,{size:192}))+'"><small>'+lab+'</small></div>');});
</script></body></html>
